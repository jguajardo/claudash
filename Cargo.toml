[package]
name = "claudash"
version = "1.1.0"
edition = "2024"
description = "The control room for Claude Code: sessions that need you, where your plan limits and dollars went, MCP, specs and secrets in transcripts. Unofficial."
authors = ["Jorge Guajardo <jguajardo87@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jguajardo/claudash"
homepage = "https://github.com/jguajardo/claudash"
readme = "README.md"
keywords = ["claude-code", "claude", "tui", "dashboard", "usage"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/assets", "/demo", "/plugin", "/.claude-plugin", "dist-workspace.toml"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1", features = ["v4"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
